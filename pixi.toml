[workspace]
name = "lpap"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.0"

[tasks]
test = "pytest -q"
lint = "ruff check src tests notebooks && ruff format --check src tests notebooks"
format = "ruff format src tests notebooks && ruff check --fix src tests notebooks"
notebook = "marimo edit notebooks/molab.py"

[dependencies]
python = "3.13.*"
pytorch-gpu = ">=2.14.1,<3"
triton = ">=3.7.1,<4"
jaxtyping = ">=0.3.11,<0.4"
huggingface_hub = ">=2.4.0,<3"
zstandard = ">=0.25.0,<0.26"
marimo = ">=0.25.1,<0.26"
pytest = ">=9.2.0,<10"
ruff = ">=0.17.6,<0.18"
cuda-driver-dev = ">=12.9,<13"
cuda-cudart-dev = ">=12.9,<13"
cuda-nvcc = ">=12.9,<13"
matplotlib = ">=3.11.2,<4"

[pypi-dependencies]
lpap = { path = ".", editable = true }
