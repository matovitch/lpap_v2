# Model shapes shared by every stage (FOUNDATION §1, §2).
value_count = 1024
image_side = 32

[flow]
width = 128
time_dim = 128
dilation_cycles = 2
dilations = [1, 2, 4, 8, 16, 32, 64, 128]
kernel_size = 3

[prior]
sigma = 1.0
scale = 0.2

[surrogate]
hidden_dim = 256
layer_count = 12
head_count = 8
rms_eps = 1e-6

[decoder]
hidden_dim = 256
layer_count = 8
head_count = 8

[[pairs]]
name = "c128_k16"
bucket_count = 128
k_max = 16
permutation_seed = 123

[[pairs]]
name = "c256_k24"
bucket_count = 256
k_max = 24
permutation_seed = 256

[[pairs]]
name = "c512_k32"
bucket_count = 512
k_max = 32
permutation_seed = 512

# Identity remap, P = 1: keeps the energy information-preserving (FOUNDATION §0).
[[pairs]]
name = "lossless"
bucket_count = 1024
k_max = 1
