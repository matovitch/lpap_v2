# Stage 1: bidirectional flow (FOUNDATION §4.1, §5).
seed = 789
batch_size = 256
learning_rate = 3e-4
warmup_steps = 1000
min_lr_ratio = 0.1
ema_decay = 0.999
max_grad_norm = 1.0
compile = true         # torch.compile train and EMA fields
bf16 = true            # autocast for the training forward only; validation and integration stay fp32
time_eps = 1e-4
time_concentration = 0.1    # u ~ Beta(c, c) per half
ot_coupling = true          # pair images with prior draws by minibatch OT (scipy assignment)
round_trip_weight = 1.0     # > 0 adds w · ‖render(encode(I)) − I‖² (fp32, backprop through 2k field calls)
round_trip_batch = 32       # images of the batch used by the round-trip term
round_trip_train_steps = 4
# Validation: fixed images, prior draws and times.
validation_seed = 30123
validation_batch_size = 256
validation_batch_count = 8
round_trip_steps = [4, 16]    # AE encoder/renderer, energy bank
band_alphas = [0.05, 0.5, 0.95, 0.999]
gallery_count = 16
gallery_sample_steps = [4, 16, 64]

[run]
steps = 20000
budget_minutes = 600
log_every = 20
validate_every = 1000
checkpoint_every = 1000
upload_every = 5000
