# Stage 5: autoencoder over all pairs (FOUNDATION §4.4–4.6, §5). v3: lr 2.8e-5, batch 64, 35k steps.
seed = 2987
batch_size = 64
learning_rate = 2.8e-5
warmup_steps = 500
min_lr_ratio = 0.1
max_grad_norm = 1.0
compile = true
bf16 = true                  # autocast for flow calls, surrogates and decoders; LPAP and losses stay fp32
integration_steps = 4        # encoder and renderer Euler steps (stage 1 trained count)
surrogate_weight = 0.05      # λ_s
probe_weight = 0.05          # λ_d
signed_mass_weight = 0.0     # λ_m: monitor only (FOUNDATION §4.5); v3 used 0.01
signed_mass_tau = 0.1
surrogate_gradient = true    # false: amplitude-only baseline (§3.4), no z path
validation_batch_size = 64
validation_batch_count = 4
gallery_count = 16

# Side terms (FOUNDATION §4.7), in priority order. 0 = monitor only; gradient reaches the encoder only.
[side]
residual_share = 0.0         # 1 − kept_share: the energy LPAP drops
probe_ce_live = 0.0          # probe CE through live (a, w): make the code decodable
usage_kl = 0.0               # KL(per-coordinate power ‖ uniform): anti fixed-support collapse

# Exploration knobs (EXPERIMENTS.md); these defaults = plain AE.
[explore]
noise_sigma = 0.0            # σ0 of the annealed relative noise on the energy (training only)
noise_decay_steps = 0        # σ decays linearly from σ0 to 0 over these steps
# encoder_steps = 8          # omitted: integration_steps; the renderer keeps integration_steps

[run]
steps = 35000
budget_minutes = 600
log_every = 25
validate_every = 500
checkpoint_every = 500
upload_every = 2500
