[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lpap"
version = "2.0.0.dev0"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.8",
  "jaxtyping>=0.3",
  "huggingface_hub>=0.34",
  "zstandard>=0.23",
  "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lpap = ["configs/*.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# F722/F821: jaxtyping shape strings.
ignore = ["E501", "F722", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# marimo displays a cell's last expression.
"notebooks/*" = ["B018"]
